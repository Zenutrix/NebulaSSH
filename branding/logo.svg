<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1260"/>
      <stop offset="0.55" stop-color="#140c2e"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8a3dff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#6200ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6200ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffb547"/>
      <stop offset="0.7" stop-color="#d9b6ff"/>
      <stop offset="1" stop-color="#7c22ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ccff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <!-- Umlaufbahn (Nebel-Ring) -->
  <ellipse cx="256" cy="262" rx="206" ry="74" transform="rotate(-24 256 262)" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
  <!-- Sterne -->
  <circle cx="392" cy="128" r="9" fill="#ffffff"/>
  <circle cx="122" cy="132" r="5" fill="#d9b6ff"/>
  <circle cx="414" cy="372" r="6" fill="#ffb547"/>
  <circle cx="150" cy="404" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- Prompt: Chevron und Cursor -->
  <path d="M150 178 L262 256 L150 334" fill="none" stroke="url(#chev)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="284" y="306" width="104" height="38" rx="19" fill="#ffb547"/>
</svg>
