[package]
name = "nebulassh"
version = "2.3.1"
edition = "2021"
description = "NebulaSSH – nativer SSH-, SFTP- und Serial-Client für Windows"
authors = ["Thomas Schöpf"]

[dependencies]
nebula-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "default_fonts", "accesskit"] }
alacritty_terminal = { version = "0.26", default-features = false }
rfd = "0.18"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false }

[build-dependencies]
winresource = "0.1"
